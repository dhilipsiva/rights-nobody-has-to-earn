<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 419" width="720" height="419" role="img" aria-labelledby="flowconstraints-title flowconstraints-desc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title id="flowconstraints-title">Six ways a fact is kept from a consequence</title>
<desc id="flowconstraints-desc">A fact about a person reaches a consequence only through six constraints: closed inputs, conclusions nobody may write, purpose-bound reads, endpoints nothing reads, no confinement from absence, and scope binding; each is checked on the written form of the rules.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs>
<rect width="720" height="419" fill="white"/>
<rect x="230" y="16" width="260" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="36" text-anchor="middle" font-weight="bold">A fact</text><text x="360.0" y="53" text-anchor="middle">an entry about a person</text><rect x="16" y="98" width="216" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="124.0" y="118" text-anchor="middle" font-weight="bold">Closed inputs</text><text x="124.0" y="135" text-anchor="middle">only admitted kinds of entry</text><rect x="252" y="98" width="216" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="118" text-anchor="middle" font-weight="bold">Unwritable conclusions</text><text x="360.0" y="135" text-anchor="middle">custody, ballots and</text><text x="360.0" y="152" text-anchor="middle">answerability are derived</text><rect x="488" y="98" width="216" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="596.0" y="118" text-anchor="middle" font-weight="bold">Purpose-bound reads</text><text x="596.0" y="135" text-anchor="middle">a record serves its own</text><text x="596.0" y="152" text-anchor="middle">purpose</text><rect x="16" y="177" width="216" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="124.0" y="197" text-anchor="middle" font-weight="bold">Endpoints</text><text x="124.0" y="214" text-anchor="middle">duties and deliveries feed</text><text x="124.0" y="231" text-anchor="middle">nothing</text><rect x="252" y="177" width="216" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="197" text-anchor="middle" font-weight="bold">No confinement from</text><text x="360.0" y="214" text-anchor="middle" font-weight="bold">absence</text><text x="360.0" y="231" text-anchor="middle">a missing entry confines</text><text x="360.0" y="248" text-anchor="middle">nobody</text><rect x="488" y="177" width="216" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="596.0" y="197" text-anchor="middle" font-weight="bold">Scope binding</text><text x="596.0" y="214" text-anchor="middle">a finding stays with its case</text><line x1="360" y1="64" x2="360" y2="94" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="230" y="289" width="260" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="309" text-anchor="middle" font-weight="bold">A consequence</text><text x="360.0" y="326" text-anchor="middle">for the person</text><line x1="360" y1="261" x2="360" y2="287" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="16" y="355" width="688" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5 4"/><text x="360.0" y="375" text-anchor="middle">Each constraint is checked on the written form of the rules; a rule reaching the same</text><text x="360.0" y="392" text-anchor="middle">consequence another way needs its own check.</text>
</svg>
