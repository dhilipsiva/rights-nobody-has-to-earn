<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" width="720" height="282" role="img" aria-labelledby="democraticcorridor-title democraticcorridor-desc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title id="democraticcorridor-title">The democratic corridor</title>
<desc id="democraticcorridor-desc">Ordinary public choice runs inside amendable constitutional law, which runs inside a protected core no amendment may remove; a choice becomes a certified result, is published and selected into force, and stays open to review and peaceful correction.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs>
<rect width="720" height="282" fill="white"/>
<rect x="12" y="12" width="696" height="256" rx="10" fill="white" stroke="black" stroke-width="2"/><text x="360" y="36" text-anchor="middle" font-weight="bold">The protected core, beyond amendment</text><text x="360" y="54" text-anchor="middle">among them standing, the floor, equality, due process, core liberties, the commons,</text><text x="360" y="71" text-anchor="middle">the animal core, the absolute prohibitions and an Assembly and Court able to sit</text><rect x="40" y="86" width="640" height="166" rx="8" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="6 4"/><text x="360" y="108" text-anchor="middle" font-weight="bold">Constitutional law, amendable</text><text x="360" y="125" text-anchor="middle">two-thirds of the full Assembly and more yes than no in a referendum</text><rect x="56" y="150" width="136" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="124.0" y="170" text-anchor="middle" font-weight="bold">A public choice</text><text x="124.0" y="187" text-anchor="middle">made within the</text><text x="124.0" y="204" text-anchor="middle">limits</text><rect x="214" y="150" width="136" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="282.0" y="170" text-anchor="middle" font-weight="bold">A certified</text><text x="282.0" y="187" text-anchor="middle" font-weight="bold">result</text><text x="282.0" y="204" text-anchor="middle">authorised and</text><text x="282.0" y="221" text-anchor="middle">certified</text><rect x="372" y="150" width="136" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="440.0" y="170" text-anchor="middle" font-weight="bold">In force</text><text x="440.0" y="187" text-anchor="middle">published and</text><text x="440.0" y="204" text-anchor="middle">selected</text><rect x="530" y="150" width="136" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="598.0" y="170" text-anchor="middle" font-weight="bold">Review</text><text x="598.0" y="187" text-anchor="middle">and peaceful</text><text x="598.0" y="204" text-anchor="middle">correction</text><line x1="192" y1="174" x2="212" y2="174" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="350" y1="174" x2="370" y2="174" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="508" y1="174" x2="528" y2="174" stroke="black" stroke-width="1.4" marker-end="url(#head)"/>
</svg>
