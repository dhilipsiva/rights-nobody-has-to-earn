<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="deliveryevidence-title deliveryevidence-desc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title id="deliveryevidence-title">Delivery evidence</title>
<desc id="deliveryevidence-desc">A receipt, an authorisation for the recipient and a matching observation, from a witness held apart from the source and from every body that owes the floor, conclude delivery of that item; a provider&#x27;s own word concludes nothing, and bodily safety, expression and belief have no delivery route.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs>
<rect width="720" height="450" fill="white"/>
<rect x="16" y="16" width="300" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="166.0" y="36" text-anchor="middle" font-weight="bold">A receipt</text><text x="166.0" y="53" text-anchor="middle">the recipient received this item from this</text><text x="166.0" y="70" text-anchor="middle">source</text><rect x="16" y="97" width="300" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="166.0" y="117" text-anchor="middle" font-weight="bold">An authorisation</text><text x="166.0" y="134" text-anchor="middle">the witness is authorised for this</text><text x="166.0" y="151" text-anchor="middle">recipient</text><rect x="16" y="178" width="300" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="166.0" y="198" text-anchor="middle" font-weight="bold">An observation</text><text x="166.0" y="215" text-anchor="middle">the witness observed this item for this</text><text x="166.0" y="232" text-anchor="middle">recipient, at the item&#x27;s scope</text><rect x="16" y="263" width="300" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5 4"/><text x="166.0" y="283" text-anchor="middle" font-weight="bold">Held apart</text><text x="166.0" y="300" text-anchor="middle">the witness is not the source, nor the</text><text x="166.0" y="317" text-anchor="middle">State, the common tier, or the person&#x27;s</text><text x="166.0" y="334" text-anchor="middle">recorded region or locality</text><rect x="420" y="140.5" width="284" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="562.0" y="160.5" text-anchor="middle" font-weight="bold">Delivery is concluded</text><text x="562.0" y="177.5" text-anchor="middle">for that item and that person, and for</text><text x="562.0" y="194.5" text-anchor="middle">nothing else</text><line x1="316" y1="48.5" x2="418" y2="173.0" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="316" y1="129.5" x2="418" y2="173.0" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="316" y1="210.5" x2="418" y2="173.0" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="316" y1="304.0" x2="418" y2="173.0" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="16" y="369" width="330" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="181.0" y="389" text-anchor="middle" font-weight="bold">Not enough</text><text x="181.0" y="406" text-anchor="middle">a provider&#x27;s own receipt and observation</text><text x="181.0" y="423" text-anchor="middle">conclude nothing</text><rect x="374" y="369" width="330" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="539.0" y="389" text-anchor="middle" font-weight="bold">No delivery route</text><text x="539.0" y="406" text-anchor="middle">bodily safety, expression and belief: answered</text><text x="539.0" y="423" text-anchor="middle">by protective duties, never by a receipt</text>
</svg>
