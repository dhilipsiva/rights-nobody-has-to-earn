<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" role="img" aria-labelledby="ordinarybill-title ordinarybill-desc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title id="ordinarybill-title">The route of an ordinary bill</title>
<desc id="ordinarybill-desc">A bill passes the People&#x27;s Assembly, the Regions Council may return it once with public reasons while its return is unused, and the Assembly&#x27;s repassage under the same voting rule ends the return and gives the Assembly lawmaking authority, separate from revenue and spending; without a finding that the return is unused, the Council has no authority to return the bill.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs>
<rect width="720" height="444" fill="white"/>
<rect x="140" y="16" width="440" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="36" text-anchor="middle" font-weight="bold">First passage</text><text x="360.0" y="53" text-anchor="middle">the People&#x27;s Assembly passes the bill under its voting rule,</text><text x="360.0" y="70" text-anchor="middle">with public reasons</text><rect x="140" y="107" width="440" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="127" text-anchor="middle" font-weight="bold">One return</text><text x="360.0" y="144" text-anchor="middle">the Regions Council may return it once, with public reasons,</text><text x="360.0" y="161" text-anchor="middle">while its return is recorded as unused</text><rect x="140" y="198" width="440" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="218" text-anchor="middle" font-weight="bold">Repassage</text><text x="360.0" y="235" text-anchor="middle">the Assembly passes it again under the same voting rule,</text><text x="360.0" y="252" text-anchor="middle">which ends the return</text><rect x="140" y="289" width="440" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="309" text-anchor="middle" font-weight="bold">Lawmaking authority</text><text x="360.0" y="326" text-anchor="middle">separate from the authority to raise revenue and to spend,</text><text x="360.0" y="343" text-anchor="middle">each of which needs its own record</text><line x1="360.0" y1="81" x2="360.0" y2="105" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="360.0" y1="172" x2="360.0" y2="196" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="360.0" y1="263" x2="360.0" y2="287" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="40" y="380" width="640" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5 4"/><text x="360.0" y="400" text-anchor="middle">Without the finding that the return is still unused, the Council has no authority to</text><text x="360.0" y="417" text-anchor="middle">return the bill.</text>
</svg>
