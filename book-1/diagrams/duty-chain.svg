<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 632" width="720" height="632" role="img" aria-labelledby="dutychain-title dutychain-desc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title id="dutychain-title">The duty chain</title>
<desc id="dutychain-desc">A person is owed the floor; the common tier, the region and the locality each owe part of it; a certified failure passes continuity up a tier while the failing body&#x27;s duty stands; a pattern of failure goes to the Constitutional Court.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs>
<rect width="720" height="632" fill="white"/>
<rect x="160" y="16" width="400" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="36" text-anchor="middle" font-weight="bold">A person</text><text x="360.0" y="53" text-anchor="middle">standing from a birth, first contact, presence,</text><text x="360.0" y="70" text-anchor="middle">effective control or a report that nobody is acting for</text><text x="360.0" y="87" text-anchor="middle">them</text><rect x="160" y="124" width="400" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="144" text-anchor="middle" font-weight="bold">Owed the floor</text><text x="360.0" y="161" text-anchor="middle">each of the nine floor items is an entitlement of the</text><text x="360.0" y="178" text-anchor="middle">person and a debt of the State</text><line x1="360" y1="98" x2="360" y2="122" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="16" y="223" width="216" height="99" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="124.0" y="243" text-anchor="middle" font-weight="bold">The common tier</text><text x="124.0" y="260" text-anchor="middle">finances, equalises and sets</text><text x="124.0" y="277" text-anchor="middle">minimum standards, and</text><text x="124.0" y="294" text-anchor="middle">backstops the floor for</text><text x="124.0" y="311" text-anchor="middle">everyone</text><line x1="360" y1="189" x2="124" y2="221" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="252" y="223" width="216" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="243" text-anchor="middle" font-weight="bold">The region</text><text x="360.0" y="260" text-anchor="middle">provides, where a witness</text><text x="360.0" y="277" text-anchor="middle">authorised for the person</text><text x="360.0" y="294" text-anchor="middle">records them present</text><line x1="360" y1="189" x2="360" y2="221" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="488" y="223" width="216" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="596.0" y="243" text-anchor="middle" font-weight="bold">The locality</text><text x="596.0" y="260" text-anchor="middle">reaches and delivers, where a</text><text x="596.0" y="277" text-anchor="middle">witness records them present</text><line x1="360" y1="189" x2="596" y2="221" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="110" y="356" width="500" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="376" text-anchor="middle" font-weight="bold">A body fails</text><text x="360.0" y="393" text-anchor="middle">certified by a source and an independent reviewer, neither of them the</text><text x="360.0" y="410" text-anchor="middle">failing body</text><line x1="124" y1="322" x2="360" y2="354" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="360" y1="305" x2="360" y2="354" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="596" y1="288" x2="360" y2="354" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="110" y="447" width="500" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="467" text-anchor="middle" font-weight="bold">Continuity passes up a tier</text><text x="360.0" y="484" text-anchor="middle">the publicly answerable tier the certification names; the failing body</text><text x="360.0" y="501" text-anchor="middle">still owes its own duty</text><line x1="360" y1="421" x2="360" y2="445" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="60" y="534" width="600" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5 4"/><text x="360.0" y="554" text-anchor="middle" font-weight="bold">Failure at scale</text><text x="360.0" y="571" text-anchor="middle">a certified pattern of failure goes to the Constitutional Court, whose declaration</text><text x="360.0" y="588" text-anchor="middle">obliges the Assembly to plan and, if it does not answer, the Court to order interim</text><text x="360.0" y="605" text-anchor="middle">measures that secure the minimum</text>
</svg>
