<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 433" width="720" height="433" role="img" aria-labelledby="placementceiling-title placementceiling-desc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title id="placementceiling-title">The placement ceiling</title>
<desc id="placementceiling-desc">Severity, found in the case, raises the most restrictive place that may be considered to a secure place; without it the ceiling is home confinement or ordinary supported residence; every place still needs availability, necessity, lawful conditions and review, and a secure place a finding that less restrictive places are insufficient.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs>
<rect width="720" height="433" fill="white"/>
<rect x="130" y="16" width="460" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="36" text-anchor="middle" font-weight="bold">A lawful sentence</text><text x="360.0" y="53" text-anchor="middle">the merits, the custody authorisation and its review period are</text><text x="360.0" y="70" text-anchor="middle">properly made for this case</text><rect x="16" y="111" width="330" height="99" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="181.0" y="131" text-anchor="middle" font-weight="bold">With an adjudicated finding of</text><text x="181.0" y="148" text-anchor="middle" font-weight="bold">severity</text><text x="181.0" y="165" text-anchor="middle">grave injury or aggravated cruelty, found in</text><text x="181.0" y="182" text-anchor="middle">this case; victim counts, raw acts, family,</text><text x="181.0" y="199" text-anchor="middle">wealth and poverty never count</text><rect x="374" y="111" width="330" height="48" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="539.0" y="131" text-anchor="middle" font-weight="bold">Without it</text><text x="539.0" y="148" text-anchor="middle">the finding is absent</text><line x1="300" y1="81" x2="181" y2="109" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="420" y1="81" x2="539" y2="109" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="16" y="240" width="330" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="181.0" y="260" text-anchor="middle" font-weight="bold">The ceiling allows</text><text x="181.0" y="277" text-anchor="middle">home confinement, ordinary supported</text><text x="181.0" y="294" text-anchor="middle">residence, or a secure place</text><rect x="374" y="240" width="330" height="65" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="539.0" y="260" text-anchor="middle" font-weight="bold">The ceiling allows</text><text x="539.0" y="277" text-anchor="middle">home confinement or ordinary supported</text><text x="539.0" y="294" text-anchor="middle">residence</text><line x1="181" y1="210" x2="181" y2="238" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="539" y1="159" x2="539" y2="238" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><rect x="70" y="335" width="580" height="82" rx="6" fill="white" stroke="black" stroke-width="1.4"/><text x="360.0" y="355" text-anchor="middle" font-weight="bold">Each place still needs</text><text x="360.0" y="372" text-anchor="middle">a named available place, individual necessity, lawful conditions and independent</text><text x="360.0" y="389" text-anchor="middle">review; a secure place also needs a finding that less restrictive places are</text><text x="360.0" y="406" text-anchor="middle">insufficient</text><line x1="181" y1="305" x2="250" y2="333" stroke="black" stroke-width="1.4" marker-end="url(#head)"/><line x1="539" y1="305" x2="470" y2="333" stroke="black" stroke-width="1.4" marker-end="url(#head)"/>
</svg>
