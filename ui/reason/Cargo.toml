# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "book-reason"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nibli-session = { path = "../../engine/nibli-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
nibli-types = { path = "../../engine/nibli-types", features = ["serde"] }
nibli-reason = { path = "../../engine/nibli-reason" }
wasm-bindgen = "0.2"

[[bin]]
name = "precompute"
path = "src/precompute.rs"
