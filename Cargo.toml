[package]
name = "rights-verify"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "rights-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.189"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
nibli-engine = { path = "../nibli/nibli-engine" }
nibli-reason = { path = "../nibli/nibli-reason" }
nibli-session = { path = "../nibli/nibli-session" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = "0.7.0"

[dev-dependencies]
tempfile = "3.26.0"

# Nix's fortified C headers require optimization, including in Rust test builds.
[profile.dev.package.tikv-jemalloc-sys]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
strip = true
