[package]
name = "rights-verify"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "rights-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2.189"
regex = "1.12.3"
quick-xml = "0.37.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.26.0"
walkdir = "2.5.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
nibli-engine = { path = "../nibli/nibli-engine" }
nibli-reason = { path = "../nibli/nibli-reason" }
nibli-session = { path = "../nibli/nibli-session" }

[build-dependencies]
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
